# =============================================================================
# StockForge AI — Atelier Edition: automatic Android APK build
# Runs on every push to main and on manual dispatch.
# Produces StockForge-AI-Atelier-v1.0.apk as a build artifact AND as a
# GitHub Release (tag v1.0.<run_number>).
# The native android/ folder is generated in CI and never committed.
# =============================================================================

name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build StockForge AI APK (Capacitor v6)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform (only if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android/ already exists — skipping cap add."
          fi

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Generate Android icons & splash screens
        run: npx capacitor-assets generate --android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk StockForge-AI-Atelier-v1.0.apk
          ls -lh StockForge-AI-Atelier-v1.0.apk

      - name: Upload APK as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockForge-AI-Atelier-v1.0
          path: StockForge-AI-Atelier-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: StockForge AI Atelier v1.0.${{ github.run_number }}
          body: |
            StockForge AI — Microstock Production Asset Studio (Atelier Edition) v1.0.${{ github.run_number }}

            - 100% offline engine, 0 API key — 6 AI agents, Global English metadata & master prompts
            - 8 microstock platforms with corrected rules (Adobe / Shutterstock / Vecteezy / Dreamstime / Freepik / iStock / Pond5 / Depositphotos)
            - Dual Luxury Theme: Obsidian Velvet & Champagne Pearl
            - Install: download the APK below and sideload it on your Android phone.
          files: StockForge-AI-Atelier-v1.0.apk
          draft: false
          prerelease: false

